name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web & Generate IPA
        run: npm run package:ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hourglass-iPhone13mini-IPA
          path: ai-hourglass.ipa
